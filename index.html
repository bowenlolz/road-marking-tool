<template id="hpt"><h2>標線竣工圖工具 使用說明</h2>
<p class="hl">輸入標線尺寸,自動算面積、畫竣工圖,匯出 DXF(CAD)或 PDF。資料存在這台裝置的瀏覽器裡。</p>
<h3>一、快速開始</h3>
<ol><li>填<b>案號</b>和<b>地址</b>。</li><li>在「標線項目」選一個項目(可用搜尋框打名稱或編號)。</li><li>在「輸入尺寸」填長度、寬度等數字;留空會用預設值。</li><li>按<b>＋加入此案件</b>,圖面和計算式會自動更新。</li><li>重複加入其他標線,最後按<b>匯出 DXF</b>或<b>匯出 PDF</b>。</li></ol>
<h3>二、圖面操作</h3>
<table><tr><th>動作</th><th>電腦</th><th>手機/平板</th></tr>
<tr><td>移動標線</td><td>拖曳圖示</td><td>手指拖曳圖示</td></tr>
<tr><td>旋轉方向</td><td>拖曳橘色 ↻ 圓點,或按朝向、微調按鈕</td><td>手指拖曳橘色 ↻ 圓點</td></tr>
<tr><td>編輯標線</td><td>點一下圖示</td><td>點一下圖示</td></tr>
<tr><td>刪除標線</td><td>編輯中按 Delete 鍵或「刪除此圖」</td><td>編輯中按「刪除此圖」</td></tr>
<tr><td>指定新增位置</td><td>點空白處</td><td>點空白處</td></tr>
<tr><td>平移畫面</td><td>拖曳空白處</td><td>手指拖曳空白處</td></tr>
<tr><td>縮放</td><td>滾輪,或圖面右上角 ＋ −</td><td>雙指縮放,或 ＋ −</td></tr>
<tr><td>還原視角</td><td>雙擊空白處或按 ⟲</td><td>按 ⟲</td></tr>
<tr><td>復原/重做</td><td>Ctrl+Z / Ctrl+Y 或按鈕</td><td>按「復原」「重做」</td></tr></table>
<p>位置也可以直接填 X、Y(公尺)和角度;方向按鈕可快速設成 0、90、180、270 度。</p>
<h3>三、標線項目與編號</h3>
<ul><li>編號依契約圖說「標線面積計算方式說明」原圖,例如 3 路面邊線、10 禁止停車線。</li>
<li>後來新增的項目掛在相近項目下:<b>3-1、10-1、11-1</b> 是圓弧轉彎;<b>11-2</b> 是可選顏色的直線標線;<b>13-1、13-2</b> 是網狀線部分復舊(外線、內線)。</li>
<li>有「組」字的項目(5組、14組、16組、20a組、20d組、31組)會一次畫出整組圖形並分項計算。</li>
<li>「註記」和「參考線」只畫在圖上,不算面積,可用來標路名、道路邊界或管溝範圍。</li>
<li>標字可以取消勾選不需要的字,例如「禁行機車」只補其中兩字。</li></ul>
<h3>四、管挖復舊的填法</h3>
<ul><li><b>線類</b>:長度填挖損的那一段,預設 1 公尺(常見管溝寬)。</li>
<li><b>虛線類</b>:以整段計算,預設 1 公尺會算 1 段;只補一小段請改用實線項目或 11-2。</li>
<li><b>枕木紋</b>:條紋長填挖到的長度,條數填被挖到的條數。</li>
<li><b>網狀線</b>:全幅重畫用 13;只補一部分用 13-1(填外線長度)和 13-2(填內線區塊的寬、長)。</li>
<li><b>槽化線、近障礙物線</b>:外框整段長 La 和包圍面積 A′ 可直接填量到的數字。</li>
<li><b>圖形、標字</b>:通常整個重畫,照整個計算。</li></ul>
<h3>五、骨材標線</h3>
<ul><li>預設為骨材標線的項目:綠斑馬(5b)、身心障礙車位藍線(20a 藍線)、孕婦及育有六歲以下兒童者停車位粉紅線(20d 粉紅線)、直線標線(11-2)。</li>
<li>骨材標線<b>不算進一般合計</b>,計算式最後另列「骨材標線合計」。沒用到就不會出現。</li>
<li>其他項目要改成骨材計價,到「⚙ 設定」勾選「以骨材標線計價」。</li></ul>
<h3>六、計算式文字</h3>
<ul><li>計算式會自動產生,也可以直接在文字框修改,並調整文字大小(案號地址一起縮放)。</li>
<li>手動改過之後不再自動更新。之後標線有變動,文字框下方會出現提醒;按「還原自動產生」重算,或確認無誤後保留手動文字。</li></ul>
<h3>七、匯出</h3>
<ul><li><b>匯出 DXF</b>:用 AutoCAD 開啟後另存 DWG。可選 CAD 文字字型。圖形單位不是實際公尺,量距離請看圖上比例尺。</li>
<li><b>匯出 PDF</b>:會開啟列印視窗,印表機選「另存為 PDF」。紙張依「匯出紙張與方向」的選擇,高度依內容。</li>
<li>匯出樣式有「標準」和「簡潔(大字)」;紙張可選 A5 或 A4,橫式或直式。</li>
<li>圖面右下角有比例尺,會自動避開標線,可在左側取消勾選。</li>
<li>手機上列印和下載的方式依瀏覽器而定;正式出圖建議用電腦。</li></ul>
<h3>八、設定(⚙)</h3>
<ul><li>可修改每個項目的名稱、規格說明、面積公式或係數、參數預設值,也可隱藏不用的項目。</li>
<li>可新增自訂項目:實線、虛線、固定圖形、矩形、標字。</li>
<li>修改後按「儲存並套用」。建議按「匯出設定」備份,換裝置時用「匯入設定」帶過去。</li></ul>
<h3>九、存檔與備份</h3>
<ul><li>案件會自動存在這台裝置的這個瀏覽器,一次一個案件。</li>
<li>清除瀏覽資料、換瀏覽器或換裝置,資料不會跟著走。重要案件請按「儲存專案(JSON)」存成檔案,之後用「開啟專案」讀回。</li>
<li>手機和電腦的資料各自獨立,要互通請用專案檔搬移。</li></ul>
<h3>十、注意事項</h3>
<ul><li>面積公式依契約圖說的標線面積計算式。網狀線全幅(13)的內線採 (W−0.4)(B−0.4)。</li>
<li>槽化線單實線(27a)的 1/2、Y 型線(27b)的 2/5 為原計算式規定,原圖未說明依據,必要時請向承辦確認。</li>
<li>圖形、箭頭依原圖輪廓繪製;標字以電腦字型顯示,非原圖變體字。</li></ul>
</template>

<script>
// ===== 顏色 =====
const C={W:'#fff',Y:'#fd0',R:'#f44',G:'#2c6',B:'#4af',P:'#e4e',BR:'#c65',GY:'#999',D:'#6cf'};
const PR={'#fff':'#000','#fd0':'#d19a00','#f44':'#d00','#2c6':'#1a7','#4af':'#06c','#e4e':'#b0b','#c65':'#b55','#999':'#777','#6cf':'#06a'};
const DX={'#fff':7,'#fd0':2,'#f44':1,'#2c6':3,'#4af':5,'#e4e':6,'#c65':30,'#999':8,'#6cf':4};
const LN={'#fff':'白色','#fd0':'黃色','#f44':'紅色','#2c6':'綠色','#4af':'藍色','#e4e':'粉紅色','#c65':'磚紅色','#999':'參考線','#6cf':'標註'};
// ===== 圖元(單位 m,y 向下) =====
const r3=v=>+(+v).toFixed(3),fm=v=>String(Math.round(v*100)),fmm=v=>r3(v)+'m';
const pl=(p,w,c,cl)=>({k:'pl',p,w,c,cl}),pg=(p,c)=>({k:'pg',p,c}),ci=(x,y,r,c)=>({k:'ci',x,y,r,c});
const rect=(x,y,w,h,c)=>pg([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],c);
const tx=(x,y,h,s,c,cw,rot)=>({k:'tx',x,y,h,s,c,cw:cw||h,rot:rot||0});
const dm=(a,b,s,side=1,off=16)=>({k:'dm',a,b,s,side,off,c:C.D}),nt=(x,y,s,c)=>({k:'nt',x,y,s,c:c||C.D});

 try{localStorage.setItem(CFGK,JSON.stringify(W))}catch(e){alert('無法儲存設定');return}
 location.reload()}
function renderList(){const L=document.getElementById('cfL');if(!L)return;
 const rows=[];IT.filter(x=>!x.custom).forEach(x=>{const m=W.over[x.id],badge=[m&&Object.keys(m).length?'已修改':'',m&&m.hide?'隱藏':''].filter(Boolean).join('、');rows.push({key:'B:'+x.id,t:x.c+' '+x.n,b:badge,s:x.c+x.n+x.id})});
 W.custom.forEach(d=>rows.push({key:'C:'+d.id,t:'＋ '+(d.c||d.id)+' '+(d.n||''),b:'自訂'+(d.hide?'、隱藏':''),s:(d.c||'')+(d.n||'')+d.id}));
 L.innerHTML=rows.filter(r=>!q||r.s.includes(q)).map(r=>`<div class="ci${r.key==sel?' on':''}" data-k="${esc(r.key)}"><span>${esc(r.t)}</span>${r.b?'<em>'+esc(r.b)+'</em>':''}</div>`).join('');
 L.querySelectorAll('.ci').forEach(el=>el.onclick=()=>{sel=el.dataset.k;renderList();renderEditor()})}
function fld(label,val,attrs){return `<div class="f"><label>${esc(label)}</label><input ${attrs||''} value="${esc(val)}"></div>`}
function renderEditor(){const E=document.getElementById('cfE');if(!E||!sel)return;const [kind,id]=[sel.slice(0,1),sel.slice(2)];
 if(kind=='B'){const x=BYID[id];if(!x)return;const o=W.over[id]||{},od=x.orig;
  let h=`<h3>${esc(x.c)} ${esc(x.n)} <small>(內建項目,編號 ${esc(x.id)})</small></h3>`;
  h+=fld('顯示編號',o.c!=null?o.c:od.c,'data-f="c"')+fld('名稱',o.n!=null?o.n:od.n,'data-f="n"');
  h+=`<div class="f"><label>規格說明</label><textarea rows="2" data-f="sp">${esc(o.sp!=null?o.sp:od.sp)}</textarea></div>`+fld('設置規則(法規條號)',o.rule!=null?o.rule:od.rule,'data-f="rule"');
  if(canCoef(x))h+=fld('面積係數(㎡/單位,可填算式如 0.1 或 4*0.1)',o.coef||od.l1,'data-f="coef"')+`<div class="nt">預設:${esc(od.l1)}。面積依此係數計算;圖面上畫的線寬維持原樣。</div>`;
  else h+='<div class="nt">此項目的面積公式較複雜,不能直接改係數(可改下方參數預設值)。</div>';
  h+=`<div class="f"><label>面積公式(算式,可用下列參數代號;填了會取代面積係數)</label><input data-f="e" value="${esc(o.e!=null?o.e:od.e)}"></div><div class="nt">代號:${esc((x.p||[]).map(p=>p.k+'='+p.l).join(';'))}<br>預設公式:${esc(od.e)}</div><div class="nt" id="cfT">${esc(trial(x,o.e!=null?o.e:od.e))}</div>`;
  const ps=(x.p||[]).filter(p=>p.t!='txt'&&p.t!='sel'&&typeof od.d[p.k]=='number');
  if(ps.length){h+='<h4>參數預設值(輸入時留空就用這個值)</h4>';ps.forEach(p=>{const cur=o.d&&o.d[p.k]!=null?o.d[p.k]:od.d[p.k];h+=`<div class="f"><label>${esc(p.l)} <small>(原預設 ${esc(od.d[p.k])})</small></label><input type="number" step="any" data-d="${esc(p.k)}" value="${esc(cur)}"></div>`})}
  h+=`<label class="chk"><input type="checkbox" data-f="bone" ${(o.bone!=null?o.bone:BONE_DEF.has(id))?'checked':''}> 以骨材標線計價(在選單說明、已加入清單與計算式加註提醒)</label><label class="chk"><input type="checkbox" data-f="hide" ${o.hide?'checked':''}> 隱藏此項目(不在項目清單出現)</label><div><button id="cfRI">還原此項目預設</button></div>`;
  E.innerHTML=h;
  E.querySelectorAll('[data-f]').forEach(el=>el.oninput=el.onchange=()=>{const k=el.dataset.f;if(k=='bone'){const o2=ov(id);if(el.checked==BONE_DEF.has(id))delete o2.bone;else o2.bone=el.checked?1:0;clean(id);dirty=true;renderList();return}if(k=='hide'){const o2=ov(id);if(el.checked)o2.hide=1;else delete o2.hide;clean(id);dirty=true;renderList();return}setOv(id,k,el.value,k=='coef'?od.l1:od[k]);if(k=='e'){const t=E.querySelector('#cfT');if(t)t.textContent=trial(x,el.value||od.e)}});
  E.querySelectorAll('[data-d]').forEach(el=>el.oninput=()=>setD(id,el.dataset.d,el.value,od.d[el.dataset.d]));
  E.querySelector('#cfRI').onclick=()=>{delete W.over[id];dirty=true;renderList();renderEditor()};return}
 const d=W.custom.find(z=>String(z.id)==id);if(!d)return;const isNew=!IT.some(x=>x.id==d.id&&x.custom);
 let h=`<h3>自訂項目 <small>${isNew?'(尚未儲存)':''}</small></h3>`;
 h+=`<div class="f"><label>項目類型</label><select data-c="type">${Object.keys(CTYPES).map(k=>`<option value="${k}"${d.type==k?' selected':''}>${CTYPES[k]}</option>`).join('')}</select></div>`;
 h+=fld('編號(唯一,不可與其他項目重複)',d.id,'data-c="id"')+fld('顯示編號',d.c,'data-c="c"')+fld('名稱',d.n,'data-c="n"');
 h+=`<div class="f"><label>顏色</label><select data-c="col">${Object.keys(CCOLN).map(k=>`<option value="${k}"${d.col==k?' selected':''}>${CCOLN[k]}</option>`).join('')}</select></div>`;
 (CF[d.type]||[]).forEach(([k,l,dv])=>{h+=fld(l,d[k]!=null?d[k]:dv,'data-c="'+k+'"'+(k=='t'?'':' type="number" step="any"'))});
 h+=fld('面積公式(算式,空白=依類型預設;可用代號:'+(CK[d.type]||'')+')',d.e||'','data-c="e"')+'<div class="nt">例:L*W*N*2 。公式需儲存並套用後才生效,不合法的公式會被忽略。</div>';
 h+=`<div class="f"><label>規格說明</label><textarea rows="2" data-c="sp">${esc(d.sp)}</textarea></div>`+fld('設置規則(法規條號)',d.rule,'data-c="rule"');
 h+=`<label class="chk"><input type="checkbox" data-c="bone" ${d.bone?'checked':''}> 以骨材標線計價(加註提醒)</label><label class="chk"><input type="checkbox" data-c="hide" ${d.hide?'checked':''}> 隱藏此項目</label><div><button id="cfDel" style="color:#b91c1c">刪除此自訂項目</button></div>`;
 E.innerHTML=h;
 E.querySelectorAll('[data-c]').forEach(el=>el.oninput=el.onchange=()=>{const k=el.dataset.c;if(k=='hide')d.hide=el.checked?1:0;else if(k=='bone')d.bone=el.checked?1:0;else d[k]=el.value;dirty=true;if(k=='id')sel='C:'+d.id;if(k=='type'){renderEditor()}renderList()});
 E.querySelector('#cfDel').onclick=()=>{if(confirm('刪除這個自訂項目?')){W.custom=W.custom.filter(z=>z!==d);sel=null;dirty=true;renderList();E.innerHTML='';}}}
window.openCfg=open;
})();

// ===== 觸控縮放 / 縮放按鈕 / 使用說明 =====
(()=>{const cv=$('cv'),PT=new Map();let pin=null,was=false;
 const zoomAt=(p,z)=>{const z0=VW.z,r=z/z0;VW.dx=(p[0]-VC[0])-(p[0]-VC[0]-VW.dx)*r;VW.dy=(p[1]-VC[1])-(p[1]-VC[1]-VW.dy)*r;VW.z=z;sheet()};
 const cl=z=>Math.min(8,Math.max(.2,z));
 const snapA=a=>{a=Math.round(a/5)*5;const m=Math.round(a/45)*45;if(Math.abs(a-m)<=5)a=m;return((a%360)+360)%360};
 cv.addEventListener('pointerdown',e=>{const p=cvp(e);if(RH&&PT.size==0&&Math.hypot(p[0]-RH.h[0],p[1]-RH.h[1])<=(e.pointerType=='touch'?24:14)){ROT=true;fixed=view;cv.setPointerCapture(e.pointerId);e.stopImmediatePropagation();sheet()}},true);
 cv.addEventListener('pointermove',e=>{if(!ROT)return;const p=cvp(e),dx=p[0]-RH.o[0],dy=p[1]-RH.o[1];if(Math.hypot(dx,dy)>6){$('pa').value=n360(snapA(Math.atan2(-dy,dx)*180/Math.PI)-aoff());sheet()}e.stopImmediatePropagation()},true);
 const rup=e=>{if(!ROT)return;ROT=false;fixed=null;e.stopImmediatePropagation();sheet()};cv.addEventListener('pointerup',rup,true);cv.addEventListener('pointercancel',rup,true);
 document.querySelectorAll('.rb').forEach(b=>b.onclick=()=>{$('pa').value=(((num('pa')+ +b.dataset.d)%360)+360)%360;sheet()});
 cv.addEventListener('pointerdown',e=>{PT.set(e.pointerId,cvp(e));if(PT.size==2){const[a,b]=[...PT.values()];pin={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z:VW.z};drag=null;fixed=null;was=true;e.stopImmediatePropagation()}else if(PT.size>2)e.stopImmediatePropagation()},true);
 cv.addEventListener('pointermove',e=>{if(!PT.has(e.pointerId))return;PT.set(e.pointerId,cvp(e));if(pin&&PT.size>=2){const[a,b]=[...PT.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;zoomAt([(a[0]+b[0])/2,(a[1]+b[1])/2],cl(pin.z*d/pin.d));e.stopImmediatePropagation()}},true);
 const up=e=>{PT.delete(e.pointerId);if(PT.size<2)pin=null;if(was){e.stopImmediatePropagation();drag=null;if(PT.size==0)was=false}};
 cv.addEventListener('pointerup',up,true);cv.addEventListener('pointercancel',up,true);
 const mid=()=>[$('M').clientWidth/2,$('M').clientHeight/2];
 $('zi').onclick=()=>zoomAt(mid(),cl(VW.z*1.3));$('zo').onclick=()=>zoomAt(mid(),cl(VW.z/1.3));$('zr').onclick=()=>{VW={dx:0,dy:0,z:1};sheet()};
 $('hpb').onclick=()=>{let o=$('hp');if(o)o.remove();o=document.createElement('div');o.id='hp';o.innerHTML='<div class="hb"><div class="hh"><b>📖 使用說明</b><span style="flex:1"></span><button id="hpc" type="button">關閉</button></div><div class="hc"></div></div>';o.querySelector('.hc').appendChild($('hpt').content.cloneNode(true));document.body.appendChild(o);o.querySelector('#hpc').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()}};
 addEventListener('orientationchange',()=>setTimeout(sheet,200));})();
